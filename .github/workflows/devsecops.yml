name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Run Bandit SAST Security Scan
        run: bandit -r src/ -ll

      - name: Run Pytest Unit Suite
        env:
          MOCK_MODE: "true"
        run: pytest -v

      - name: Build Docker Image
        run: docker build -t cti-orchestrator:${{ github.sha }} .

      - name: Run Trivy Vulnerability Scanner on Container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cti-orchestrator:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"